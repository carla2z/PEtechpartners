<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 1: Show the Windows 11 sign-in screen</title>
  <desc id="desc">Illustration of a locked Windows 11 PC with a callout telling the user to press any key or click to show the sign-in screen.</desc>
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2e50"/>
      <stop offset="0.42" stop-color="#255f82"/>
      <stop offset="1" stop-color="#87ceeb"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="25%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.44"/>
      <stop offset="0.35" stop-color="#bf0a30" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a2e50" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#061d33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#eef4f8"/>
  <rect x="98" y="58" width="1004" height="602" rx="34" fill="#1b2430" filter="url(#shadow)"/>
  <rect x="124" y="84" width="952" height="534" rx="20" fill="url(#screenBg)"/>
  <rect x="124" y="84" width="952" height="534" rx="20" fill="url(#glow)"/>

  <circle cx="306" cy="188" r="92" fill="#ffffff" opacity="0.11"/>
  <circle cx="860" cy="452" r="144" fill="#ffffff" opacity="0.08"/>
  <path d="M124 526 C260 470, 322 518, 448 474 C610 418, 716 538, 1076 454 L1076 618 L124 618 Z" fill="#061d33" opacity="0.2"/>

  <text x="186" y="220" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="98" font-weight="700">9:41</text>
  <text x="194" y="268" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="27" opacity="0.92">Wednesday, May 13</text>

  <g transform="translate(917 536)" opacity="0.92">
    <path d="M0 38 C16 22, 44 22, 60 38" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M13 51 C23 42, 37 42, 47 51" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="30" cy="66" r="5.8" fill="#ffffff"/>
    <circle cx="30" cy="51" r="62" fill="none" stroke="#f8d44c" stroke-width="8" opacity="0.98"/>
  </g>
  <g transform="translate(1009 576)" fill="#ffffff" opacity="0.86">
    <circle cx="0" cy="0" r="20"/>
    <rect x="-3" y="-24" width="6" height="28" rx="3" fill="#0a2e50"/>
  </g>

  <rect x="216" y="402" width="472" height="156" rx="22" fill="#ffffff" opacity="0.96"/>
  <text x="250" y="452" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Press any key or click</text>
  <text x="250" y="494" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">This brings up the sign-in screen,</text>
  <text x="250" y="526" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">where the network icon is available.</text>

  <path d="M690 471 C762 480, 833 508, 917 572" fill="none" stroke="#bf0a30" stroke-width="8" stroke-linecap="round"/>
  <path d="M917 572 L884 561 L907 540 Z" fill="#bf0a30"/>

  <rect x="451" y="652" width="298" height="30" rx="15" fill="#26313d"/>
</svg>
