<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 2: Open the network menu</title>
  <desc id="desc">Illustration of the Windows 11 sign-in screen with the bottom-right network icon highlighted.</desc>
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a48"/>
      <stop offset="0.48" stop-color="#2d6c8a"/>
      <stop offset="1" stop-color="#a6d6e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#061d33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#eef4f8"/>
  <rect x="98" y="58" width="1004" height="602" rx="34" fill="#1b2430" filter="url(#shadow)"/>
  <rect x="124" y="84" width="952" height="534" rx="20" fill="url(#screenBg)"/>

  <g transform="translate(498 164)">
    <circle cx="102" cy="76" r="72" fill="#ffffff" opacity="0.93"/>
    <circle cx="102" cy="58" r="24" fill="#90a4b8"/>
    <path d="M52 127 C65 96, 139 96, 152 127" fill="#90a4b8"/>
    <text x="102" y="202" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">User</text>
    <rect x="10" y="232" width="184" height="48" rx="8" fill="#ffffff" opacity="0.92"/>
    <text x="102" y="264" text-anchor="middle" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="21">PIN</text>
  </g>

  <g transform="translate(886 548)" opacity="0.98">
    <rect x="-38" y="-34" width="190" height="96" rx="20" fill="#ffffff" opacity="0.14"/>
    <g transform="translate(18 0)">
      <path d="M0 23 C16 7, 44 7, 60 23" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <path d="M13 36 C23 27, 37 27, 47 36" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="30" cy="51" r="5.8" fill="#ffffff"/>
      <circle cx="30" cy="36" r="58" fill="none" stroke="#f8d44c" stroke-width="8"/>
    </g>
    <g transform="translate(118 36)" fill="#ffffff" opacity="0.84">
      <circle cx="0" cy="0" r="20"/>
      <rect x="-3" y="-24" width="6" height="28" rx="3" fill="#142a48"/>
    </g>
  </g>

  <rect x="168" y="398" width="438" height="148" rx="22" fill="#ffffff" opacity="0.97"/>
  <text x="202" y="448" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Click the network icon</text>
  <text x="202" y="490" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">It is in the bottom-right corner,</text>
  <text x="202" y="522" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">near the power button.</text>

  <path d="M610 459 C716 480, 798 518, 901 584" fill="none" stroke="#bf0a30" stroke-width="8" stroke-linecap="round"/>
  <path d="M901 584 L868 578 L890 552 Z" fill="#bf0a30"/>

  <rect x="451" y="652" width="298" height="30" rx="15" fill="#26313d"/>
</svg>
