<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 3: Select the Wi-Fi network</title>
  <desc id="desc">Illustration of a Windows 11 network flyout with Company Wi-Fi selected and the Connect button highlighted.</desc>
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a48"/>
      <stop offset="0.5" stop-color="#2d6c8a"/>
      <stop offset="1" stop-color="#a6d6e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#061d33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#eef4f8"/>
  <rect x="98" y="58" width="1004" height="602" rx="34" fill="#1b2430" filter="url(#shadow)"/>
  <rect x="124" y="84" width="952" height="534" rx="20" fill="url(#screenBg)"/>

  <rect x="720" y="132" width="310" height="430" rx="24" fill="#f7fbff" stroke="#d7e3ec" stroke-width="2"/>
  <text x="752" y="178" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Network</text>
  <text x="752" y="215" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18">Not connected</text>

  <rect x="752" y="246" width="246" height="52" rx="14" fill="#e8f3fb"/>
  <g transform="translate(774 260)">
    <path d="M0 17 C10 7, 29 7, 40 17" fill="none" stroke="#0a2e50" stroke-width="4" stroke-linecap="round"/>
    <path d="M9 27 C15 21, 25 21, 31 27" fill="none" stroke="#0a2e50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="36" r="3.8" fill="#0a2e50"/>
  </g>
  <text x="834" y="279" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Wi-Fi</text>
  <text x="948" y="280" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="22">&gt;</text>

  <rect x="742" y="324" width="268" height="146" rx="18" fill="#ffffff" stroke="#bf0a30" stroke-width="4"/>
  <text x="768" y="360" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Company Wi-Fi</text>
  <text x="768" y="390" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16">Secured</text>
  <rect x="768" y="410" width="18" height="18" rx="4" fill="#ffffff" stroke="#7c8b99" stroke-width="2"/>
  <path d="M772 418 L778 424 L785 413" fill="none" stroke="#0a2e50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="794" y="426" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="16">Connect automatically</text>
  <rect x="888" y="400" width="96" height="42" rx="9" fill="#0a2e50"/>
  <text x="936" y="428" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Connect</text>

  <text x="768" y="514" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="18">Guest Wi-Fi</text>
  <text x="768" y="546" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="18">Mobile Hotspot</text>

  <rect x="166" y="382" width="462" height="148" rx="22" fill="#ffffff" opacity="0.97"/>
  <text x="200" y="431" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Select the right Wi-Fi</text>
  <text x="200" y="473" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">Choose the company or guest network,</text>
  <text x="200" y="505" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">then click Connect.</text>

  <path d="M632 441 C672 436, 710 425, 766 413" fill="none" stroke="#bf0a30" stroke-width="8" stroke-linecap="round"/>
  <path d="M766 413 L735 432 L738 398 Z" fill="#bf0a30"/>

  <rect x="451" y="652" width="298" height="30" rx="15" fill="#26313d"/>
</svg>
