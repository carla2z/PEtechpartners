<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 4: Enter the Wi-Fi password</title>
  <desc id="desc">Illustration of the Windows 11 Wi-Fi password prompt with the password box and Next button highlighted.</desc>
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a48"/>
      <stop offset="0.5" stop-color="#2d6c8a"/>
      <stop offset="1" stop-color="#a6d6e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#061d33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#eef4f8"/>
  <rect x="98" y="58" width="1004" height="602" rx="34" fill="#1b2430" filter="url(#shadow)"/>
  <rect x="124" y="84" width="952" height="534" rx="20" fill="url(#screenBg)"/>

  <rect x="688" y="142" width="350" height="382" rx="24" fill="#f7fbff" stroke="#d7e3ec" stroke-width="2"/>
  <text x="724" y="188" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Company Wi-Fi</text>
  <text x="724" y="224" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="18">Enter the network security key</text>

  <rect x="724" y="254" width="278" height="56" rx="9" fill="#ffffff" stroke="#bf0a30" stroke-width="4"/>
  <text x="748" y="290" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">••••••••••••</text>
  <rect x="724" y="332" width="20" height="20" rx="4" fill="#ffffff" stroke="#8a99a7" stroke-width="2"/>
  <text x="754" y="349" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="17">Hide characters</text>

  <rect x="724" y="402" width="94" height="42" rx="9" fill="#e5edf4"/>
  <text x="771" y="430" text-anchor="middle" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Cancel</text>
  <rect x="842" y="402" width="116" height="42" rx="9" fill="#0a2e50"/>
  <text x="900" y="430" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Next</text>

  <rect x="158" y="360" width="468" height="150" rx="22" fill="#ffffff" opacity="0.97"/>
  <text x="192" y="410" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Enter the Wi-Fi password</text>
  <text x="192" y="452" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">Type the password exactly, including</text>
  <text x="192" y="484" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">capital letters and symbols. Click Next.</text>

  <path d="M628 424 C666 385, 700 339, 736 290" fill="none" stroke="#bf0a30" stroke-width="8" stroke-linecap="round"/>
  <path d="M736 290 L727 325 L704 300 Z" fill="#bf0a30"/>
  <path d="M630 456 C706 472, 797 464, 881 425" fill="none" stroke="#bf0a30" stroke-width="8" stroke-linecap="round"/>
  <path d="M881 425 L855 451 L849 417 Z" fill="#bf0a30"/>

  <rect x="451" y="652" width="298" height="30" rx="15" fill="#26313d"/>
</svg>
