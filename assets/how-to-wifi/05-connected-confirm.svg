<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step 5: Confirm Wi-Fi is connected</title>
  <desc id="desc">Illustration showing Company Wi-Fi marked as connected and the user ready to sign in.</desc>
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a48"/>
      <stop offset="0.5" stop-color="#2d6c8a"/>
      <stop offset="1" stop-color="#a6d6e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#061d33" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#eef4f8"/>
  <rect x="98" y="58" width="1004" height="602" rx="34" fill="#1b2430" filter="url(#shadow)"/>
  <rect x="124" y="84" width="952" height="534" rx="20" fill="url(#screenBg)"/>

  <g transform="translate(214 184)">
    <circle cx="102" cy="76" r="72" fill="#ffffff" opacity="0.93"/>
    <circle cx="102" cy="58" r="24" fill="#90a4b8"/>
    <path d="M52 127 C65 96, 139 96, 152 127" fill="#90a4b8"/>
    <text x="102" y="202" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">User</text>
    <rect x="10" y="232" width="184" height="48" rx="8" fill="#ffffff" opacity="0.92"/>
    <text x="102" y="264" text-anchor="middle" fill="#52606d" font-family="Segoe UI, Arial, sans-serif" font-size="21">PIN</text>
  </g>

  <rect x="698" y="142" width="340" height="390" rx="24" fill="#f7fbff" stroke="#d7e3ec" stroke-width="2"/>
  <text x="734" y="188" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Network</text>
  <rect x="730" y="224" width="272" height="96" rx="18" fill="#e7f5ee" stroke="#2f8f5b" stroke-width="4"/>
  <g transform="translate(758 242)">
    <path d="M0 21 C13 8, 36 8, 50 21" fill="none" stroke="#2f8f5b" stroke-width="5" stroke-linecap="round"/>
    <path d="M11 34 C19 27, 31 27, 39 34" fill="none" stroke="#2f8f5b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="25" cy="48" r="4.6" fill="#2f8f5b"/>
  </g>
  <text x="828" y="264" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Company Wi-Fi</text>
  <text x="828" y="294" fill="#2f6f4a" font-family="Segoe UI, Arial, sans-serif" font-size="17">Connected, secured</text>

  <rect x="730" y="360" width="272" height="56" rx="14" fill="#ffffff"/>
  <text x="758" y="395" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="18">Guest Wi-Fi</text>
  <rect x="730" y="428" width="272" height="56" rx="14" fill="#ffffff"/>
  <text x="758" y="463" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="18">Mobile Hotspot</text>

  <rect x="176" y="454" width="448" height="154" rx="22" fill="#ffffff" opacity="0.97"/>
  <text x="210" y="504" fill="#0a2e50" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Confirm it says Connected</text>
  <text x="210" y="546" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">Once connected, close the menu and</text>
  <text x="210" y="578" fill="#31465c" font-family="Segoe UI, Arial, sans-serif" font-size="24">sign in normally.</text>

  <circle cx="1012" cy="126" r="48" fill="#2f8f5b"/>
  <path d="M990 126 L1005 142 L1036 108" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M626 513 C676 460, 718 365, 760 291" fill="none" stroke="#bf0a30" stroke-width="8" stroke-linecap="round"/>
  <path d="M760 291 L750 326 L728 301 Z" fill="#bf0a30"/>

  <rect x="451" y="652" width="298" height="30" rx="15" fill="#26313d"/>
</svg>
